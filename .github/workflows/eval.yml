# Runs the frozen regression eval subset on every PR that can change answers (brief §5, §7).
# Hard gates (leakage, PII, inference-only, system prompt/injection) block the merge, and so
# does any metric below its floor in evals/thresholds.yaml. Posts the score table on the PR.
name: eval

on:
  pull_request:
    paths:
      - "app/**"
      - "prompts/**"
      - "ingest/**"
      - "data/**"
      - "evals/**"
      - "db/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/eval.yml"
  workflow_dispatch:
    inputs:
      suite:
        description: Eval suite to run
        default: regression
        type: choice
        options: [regression, all]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUITE: ${{ inputs.suite || 'regression' }}
    steps:
      - name: Require the API key secret
        if: env.ANTHROPIC_API_KEY == ''
        run: |
          echo "::error::Repository secret ANTHROPIC_API_KEY is not set, so no eval report can be produced."
          exit 1
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.8"
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - name: Write throwaway CI database passwords
        run: |
          for v in ETRM_OWNER_PASSWORD ETRM_APP_PASSWORD ETRM_INGEST_PASSWORD; do
            echo "$v=$(openssl rand -hex 16)" >> .env
          done
          printf 'ETRM_DB_HOST=127.0.0.1\nETRM_DB_PORT=5433\n' >> .env
      - run: docker compose up -d --wait db
      - run: uv sync --frozen
      - run: uv run python -m ingest.cli
      - name: Run evals
        # Don't stop here on a gate failure: the compare step reports it and fails the job.
        run: uv run python -m evals.run --suite "$SUITE" || true
      - name: Compare with baseline and thresholds
        id: compare
        run: |
          RESULTS=$(ls -t evals/results/*.json | head -1)
          echo "results=$RESULTS" >> "$GITHUB_OUTPUT"
          uv run python -m evals.compare check --results "$RESULTS" --markdown eval-report.md
      - name: Job summary
        if: always() && steps.compare.outputs.results != ''
        run: cat eval-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on the PR
        if: always() && github.event_name == 'pull_request' && steps.compare.outputs.results != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --edit-last --body-file eval-report.md \
            || gh pr comment "$PR" --body-file eval-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: |
            evals/results/*.json
            eval-report.md
