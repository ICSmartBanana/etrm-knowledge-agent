# Local development stack. Dev-only passwords come from .env (see .env.example).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: etrm_owner
      POSTGRES_DB: etrm
      POSTGRES_PASSWORD: ${ETRM_OWNER_PASSWORD:?set ETRM_OWNER_PASSWORD in .env}
      ETRM_APP_PASSWORD: ${ETRM_APP_PASSWORD:?set ETRM_APP_PASSWORD in .env}
      ETRM_INGEST_PASSWORD: ${ETRM_INGEST_PASSWORD:?set ETRM_INGEST_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etrm_owner -d etrm"]
      interval: 5s
      retries: 10
    mem_limit: 512m

  api:
    build: .
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
      ETRM_APP_PASSWORD: ${ETRM_APP_PASSWORD}
      ETRM_DB_HOST: db
      ETRM_DB_PORT: "5432"
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      ETRM_ENV: docker
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1g

  ui:
    build: .
    command: ["streamlit", "run", "app/ui/streamlit_app.py", "--server.address=0.0.0.0",
              "--server.port=8501", "--browser.gatherUsageStats=false"]
    environment:
      ETRM_API_URL: http://api:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      - api
    mem_limit: 512m

volumes:
  pgdata:
